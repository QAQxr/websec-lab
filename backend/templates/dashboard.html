{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<section class="card">
    <p class="muted">AcmeCloud workspace</p>
    <h1>Welcome, {{ user.username }}</h1>

    <p><a class="secondary" href="{{ url_for('projects.index') }}">View projects</a></p>
</section>
{% endblock %}
